<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
    }
    .status {
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 16px;
      min-height: 24px;
    }
    .status span { color: #38bdf8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      margin: 0 auto 16px;
    }
    .cell {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      font-size: 36px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cell:hover:not(.taken) {
      background: #1e293b;
      border-color: #38bdf8;
    }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
    .cell.win {
      background: #064e3b;
      border-color: #10b981;
      color: #34d399;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .btn {
      background: #334155;
      color: #f1f5f9;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .btn:hover { background: #475569; }
    .btn.active {
      background: #0284c7;
      color: #ffffff;
    }
    .reset-btn {
      background: #10b981;
      color: #022c22;
    }
    .reset-btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="game-card">
    <div id="status" class="status">Turn: <span>X</span></div>
    <div id="grid" class="grid"></div>
    <div class="controls">
      <button id="mode-pvc" class="btn active">vs CPU</button>
      <button id="mode-pvp" class="btn">2 Players</button>
      <button id="reset-btn" class="btn reset-btn">Reset</button>
    </div>
  </div>

  <script>
    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let isGameOver = false;
    let vsCpu = true;

    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const modePvcBtn = document.getElementById('mode-pvc');
    const modePvpBtn = document.getElementById('mode-pvp');

    const WINNING_COMBOS = [
      [0,1,2], [3,4,5], [6,7,8], // rows
      [0,3,6], [1,4,7], [2,5,8], // cols
      [0,4,8], [2,4,6]           // diagonals
    ];

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function init() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      isGameOver = false;
      statusEl.innerHTML = `Turn: <span>${currentPlayer}</span>`;
      gridEl.innerHTML = '';

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', () => makeMove(i));
        gridEl.appendChild(cell);
      }
    }

    function makeMove(idx) {
      if (board[idx] || isGameOver) return;

      board[idx] = currentPlayer;
      const cell = gridEl.children[idx];
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase(), 'taken');
      beep(currentPlayer === 'X' ? 440 : 550, 0.05);

      const winCombo = checkWin(board, currentPlayer);
      if (winCombo) {
        endGame(currentPlayer, winCombo);
        return;
      }

      if (board.every(cell => cell !== null)) {
        endGame('tie');
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusEl.innerHTML = `Turn: <span>${currentPlayer}</span>`;

      if (vsCpu && currentPlayer === 'O' && !isGameOver) {
        setTimeout(cpuMove, 300);
      }
    }

    function cpuMove() {
      if (isGameOver) return;
      // 1. Can CPU win?
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          if (checkWin(board, 'O')) {
            board[i] = null;
            makeMove(i);
            return;
          }
          board[i] = null;
        }
      }
      // 2. Block player X
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'X';
          if (checkWin(board, 'X')) {
            board[i] = null;
            makeMove(i);
            return;
          }
          board[i] = null;
        }
      }
      // 3. Take center
      if (!board[4]) {
        makeMove(4);
        return;
      }
      // 4. Random available
      const empty = [];
      for (let i = 0; i < 9; i++) if (!board[i]) empty.push(i);
      if (empty.length > 0) {
        const pick = empty[Math.floor(Math.random() * empty.length)];
        makeMove(pick);
      }
    }

    function checkWin(b, player) {
      for (let combo of WINNING_COMBOS) {
        if (combo.every(idx => b[idx] === player)) {
          return combo;
        }
      }
      return null;
    }

    function endGame(winner, combo = []) {
      isGameOver = true;
      if (winner === 'tie') {
        statusEl.innerHTML = `<span style="color:#e2e8f0;">It's a Tie!</span>`;
        beep(220, 0.2);
      } else {
        statusEl.innerHTML = `<span style="color:#10b981;">Player ${winner} Wins!</span>`;
        combo.forEach(idx => {
          gridEl.children[idx].classList.add('win');
        });
        beep(660, 0.3);
      }
    }

    modePvcBtn.addEventListener('click', () => {
      vsCpu = true;
      modePvcBtn.classList.add('active');
      modePvpBtn.classList.remove('active');
      init();
    });

    modePvpBtn.addEventListener('click', () => {
      vsCpu = false;
      modePvpBtn.classList.add('active');
      modePvcBtn.classList.remove('active');
      init();
    });

    resetBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
