<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }
    .score-val { color: #10b981; font-size: 18px; }
    #canvas-container {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      border-radius: 10px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 { font-size: 24px; margin-bottom: 8px; color: #f1f5f9; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
    .btn {
      background: #10b981;
      color: #022c22;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-gap: 8px;
      margin-top: 12px;
    }
    .touch-btn {
      width: 48px;
      height: 48px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .touch-btn:active { background: #334155; color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span id="score" class="score-val">0</span></div>
    <div>BEST: <span id="high-score" class="score-val">0</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">RETRO SNAKE</h2>
      <p id="overlay-desc">Use arrow keys or WASD to navigate</p>
      <button id="start-btn" class="btn">PLAY GAME</button>
    </div>
  </div>

  <div class="controls-hint">Desktop: Arrow Keys / WASD • Space to Pause</div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" id="btn-up">▲</button>
    <div></div>
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-down">▼</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    highScoreEl.textContent = highScore;

    let gameInterval = null;
    let isRunning = false;
    let isPaused = false;

    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration, type='sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreEl.textContent = score;
      placeFood();
      isRunning = true;
      isPaused = false;
      overlay.style.display = 'none';
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 110);
    }

    function placeFood() {
      while (true) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        let onSnake = false;
        for (let segment of snake) {
          if (segment.x === food.x && segment.y === food.y) {
            onSnake = true;
            break;
          }
        }
        if (!onSnake) break;
      }
    }

    function gameLoop() {
      if (isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_highscore', highScore.toString());
        }
        beep(587.33, 0.1, 'square');
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Food highlight
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 3,
        food.y * GRID_SIZE + GRID_SIZE / 3,
        2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(
            segment.x * GRID_SIZE + 1,
            segment.y * GRID_SIZE + 1,
            GRID_SIZE - 2,
            GRID_SIZE - 2
          );

          // Eyes
          ctx.fillStyle = '#022c22';
          const eyeSize = 3;
          if (dx === 1) {
            ctx.fillRect(segment.x * GRID_SIZE + 14, segment.y * GRID_SIZE + 4, eyeSize, eyeSize);
            ctx.fillRect(segment.x * GRID_SIZE + 14, segment.y * GRID_SIZE + 12, eyeSize, eyeSize);
          } else if (dx === -1) {
            ctx.fillRect(segment.x * GRID_SIZE + 3, segment.y * GRID_SIZE + 4, eyeSize, eyeSize);
            ctx.fillRect(segment.x * GRID_SIZE + 3, segment.y * GRID_SIZE + 12, eyeSize, eyeSize);
          } else if (dy === 1) {
            ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 14, eyeSize, eyeSize);
            ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 14, eyeSize, eyeSize);
          } else {
            ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 3, eyeSize, eyeSize);
            ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 3, eyeSize, eyeSize);
          }
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#059669' : '#047857';
          ctx.fillRect(
            segment.x * GRID_SIZE + 2,
            segment.y * GRID_SIZE + 2,
            GRID_SIZE - 4,
            GRID_SIZE - 4
          );
        }
      });
    }

    function gameOver() {
      clearInterval(gameInterval);
      isRunning = false;
      beep(150, 0.3, 'sawtooth');
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.textContent = `Final Score: ${score}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function setDirection(newDx, newDy) {
      if (!isRunning) return;
      if (newDx !== -dx || snake.length === 1) {
        nextDx = newDx;
      }
      if (newDy !== -dy || snake.length === 1) {
        nextDy = newDy;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dy === 0) {
        setDirection(0, -1);
      } else if (['ArrowDown', 'KeyS'].includes(e.code) && dy === 0) {
        setDirection(0, 1);
      } else if (['ArrowLeft', 'KeyA'].includes(e.code) && dx === 0) {
        setDirection(-1, 0);
      } else if (['ArrowRight', 'KeyD'].includes(e.code) && dx === 0) {
        setDirection(1, 0);
      } else if (e.code === 'Space') {
        if (isRunning) {
          isPaused = !isPaused;
          if (isPaused) {
            overlayTitle.textContent = 'PAUSED';
            overlayDesc.textContent = 'Press Space to Resume';
            startBtn.textContent = 'RESUME';
            overlay.style.display = 'flex';
          } else {
            overlay.style.display = 'none';
          }
        }
      }
    });

    startBtn.addEventListener('click', () => {
      if (isPaused) {
        isPaused = false;
        overlay.style.display = 'none';
      } else {
        initGame();
      }
    });

    document.getElementById('btn-up').addEventListener('click', () => { if (dy === 0) setDirection(0, -1); });
    document.getElementById('btn-down').addEventListener('click', () => { if (dy === 0) setDirection(0, 1); });
    document.getElementById('btn-left').addEventListener('click', () => { if (dx === 0) setDirection(-1, 0); });
    document.getElementById('btn-right').addEventListener('click', () => { if (dx === 0) setDirection(1, 0); });

    draw();
  </script>
</body>
</html>
