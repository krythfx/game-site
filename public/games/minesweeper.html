<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .board-frame {
      background: #1e293b;
      border: 3px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .lcd {
      font-family: "Courier New", Courier, monospace;
      background: #020617;
      color: #ef4444;
      font-size: 22px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 54px;
      text-align: center;
      border: 1px solid #1e293b;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-template-rows: repeat(9, 32px);
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 6px;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #475569;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.2), inset -1px -1px 0 rgba(0,0,0,0.3);
    }
    .cell:hover:not(.revealed) { background: #64748b; }
    .cell.revealed {
      background: #0f172a;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.6);
      cursor: default;
    }
    .cell.mine { background: #dc2626 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fbbf24; }
    .c-6 { color: #2dd4bf; }
    .c-7 { color: #f472b6; }
    .c-8 { color: #cbd5e1; }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .flag-toggle-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .flag-toggle-btn.active {
      background: #f59e0b;
      color: #020617;
      border-color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="board-frame">
    <div class="status-bar">
      <div id="mines-lcd" class="lcd">010</div>
      <button id="face" class="face-btn">🙂</button>
      <div id="timer-lcd" class="lcd">000</div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="mode-toggle">
    <button id="flag-btn" class="flag-toggle-btn">Flag Mode: OFF 🚩</button>
  </div>

  <div class="controls-hint">Left Click to Reveal • Right Click to Flag</div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let timer = 0;
    let timerInterval = null;
    let isGameOver = false;
    let firstClick = true;
    let flagMode = false;

    const gridEl = document.getElementById('grid');
    const minesLcd = document.getElementById('mines-lcd');
    const timerLcd = document.getElementById('timer-lcd');
    const faceBtn = document.getElementById('face');
    const flagToggleBtn = document.getElementById('flag-btn');

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration, type='sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    flagToggleBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagToggleBtn.classList.toggle('active', flagMode);
      flagToggleBtn.textContent = `Flag Mode: ${flagMode ? 'ON' : 'OFF'} 🚩`;
    });

    function initBoard() {
      if (timerInterval) clearInterval(timerInterval);
      timer = 0;
      timerLcd.textContent = '000';
      flagsCount = 0;
      minesLcd.textContent = '010';
      revealedCount = 0;
      isGameOver = false;
      firstClick = true;
      faceBtn.textContent = '🙂';

      board = [];
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: null
          };

          const el = document.createElement('div');
          el.className = 'cell';
          el.addEventListener('click', (e) => {
            if (flagMode) {
              toggleFlag(cell);
            } else {
              handleClick(cell);
            }
          });
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(cell);
          });

          cell.el = el;
          board[r][c] = cell;
          gridEl.appendChild(el);
        }
      }
    }

    function placeMines(firstR, firstC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if ((r === firstR && c === firstC) || board[r][c].mine) continue;
        board[r][c].mine = true;
        placed++;
      }

      // Compute adjacent numbers
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].mine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) {
                count++;
              }
            }
          }
          board[r][c].count = count;
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer++;
        if (timer > 999) timer = 999;
        timerLcd.textContent = timer.toString().padStart(3, '0');
      }, 1000);
    }

    function toggleFlag(cell) {
      if (isGameOver || cell.revealed) return;
      cell.flagged = !cell.flagged;
      if (cell.flagged) {
        cell.el.textContent = '🚩';
        flagsCount++;
        beep(520, 0.05);
      } else {
        cell.el.textContent = '';
        flagsCount--;
        beep(400, 0.05);
      }
      const remaining = MINES - flagsCount;
      minesLcd.textContent = remaining.toString().padStart(3, remaining < 0 ? '-' : '0');
    }

    function handleClick(cell) {
      if (isGameOver || cell.revealed || cell.flagged) return;

      if (firstClick) {
        firstClick = false;
        placeMines(cell.r, cell.c);
        startTimer();
      }

      if (cell.mine) {
        // Boom!
        revealMine(cell);
        gameOver(false);
        return;
      }

      revealCell(cell);
      beep(320 + cell.count * 40, 0.04);

      if (revealedCount === ROWS * COLS - MINES) {
        gameOver(true);
      }
    }

    function revealCell(cell) {
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      revealedCount++;
      cell.el.classList.add('revealed');

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`c-${cell.count}`);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = cell.r + dr;
            const nc = cell.c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(board[nr][nc]);
            }
          }
        }
      }
    }

    function revealMine(hitCell) {
      hitCell.el.classList.add('mine');
      hitCell.el.textContent = '💥';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const current = board[r][c];
          if (current.mine && current !== hitCell) {
            current.el.classList.add('revealed');
            current.el.textContent = '💣';
          }
        }
      }
    }

    function gameOver(won) {
      isGameOver = true;
      clearInterval(timerInterval);
      if (won) {
        faceBtn.textContent = '😎';
        beep(740, 0.25);
      } else {
        faceBtn.textContent = '😵';
        beep(140, 0.3, 'sawtooth');
      }
    }

    faceBtn.addEventListener('click', initBoard);
    initBoard();
  </script>
</body>
</html>
