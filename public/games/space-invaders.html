<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 460px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .stat-val { color: #a855f7; font-size: 18px; font-family: monospace; }
    #canvas-container {
      position: relative;
      background: #030712;
      border: 2px solid #1f2937;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
    }
    canvas {
      display: block;
      border-radius: 10px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 { font-size: 24px; margin-bottom: 8px; color: #f1f5f9; letter-spacing: 0.05em; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
    .btn {
      background: #a855f7;
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #c084fc; }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span id="score" class="stat-val">0</span></div>
    <div>LIVES: <span id="lives" class="stat-val" style="color:#22c55e">▲▲▲</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="460" height="420"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">SPACE INVADERS</h2>
      <p id="overlay-desc">Defend the earth against alien waves!</p>
      <button id="start-btn" class="btn">LAUNCH DEFENSE</button>
    </div>
  </div>

  <div class="controls-hint">← / → or A / D to steer • Space to shoot laser</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let lives = 3;
    let isRunning = false;

    const player = {
      x: canvas.width / 2 - 16,
      y: canvas.height - 30,
      width: 32,
      height: 16,
      speed: 5
    };

    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDirection = 1;
    let alienStepDown = false;
    let alienMoveTimer = 0;
    let alienMoveInterval = 40; // frames
    let alienSpeedX = 8;

    const keys = {};

    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration, type='sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      const startX = 40;
      const startY = 40;
      const spacingX = 42;
      const spacingY = 30;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: startX + c * spacingX,
            y: startY + r * spacingY,
            width: 24,
            height: 18,
            row: r,
            alive: true
          });
        }
      }
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '▲▲▲';
      player.x = canvas.width / 2 - 16;
      bullets = [];
      alienBullets = [];
      alienDirection = 1;
      alienMoveInterval = 35;
      initAliens();
      isRunning = true;
      overlay.style.display = 'none';
      requestAnimationFrame(loop);
    }

    let lastShotTime = 0;
    function shoot() {
      const now = performance.now();
      if (now - lastShotTime < 280) return;
      lastShotTime = now;
      bullets.push({
        x: player.x + player.width / 2 - 1.5,
        y: player.y - 4,
        width: 3,
        height: 10,
        vy: -7
      });
      beep(880, 0.04, 'square');
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isRunning) {
        e.preventDefault();
        shoot();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function update() {
      if (!isRunning) return;

      // Player Movement
      if (keys['ArrowLeft'] || keys['KeyA']) {
        player.x = Math.max(10, player.x - player.speed);
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        player.x = Math.min(canvas.width - player.width - 10, player.x + player.speed);
      }

      // Player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Alien collision
        let hit = false;
        for (let a of aliens) {
          if (a.alive &&
              bullets[i].x + bullets[i].width > a.x &&
              bullets[i].x < a.x + a.width &&
              bullets[i].y < a.y + a.height &&
              bullets[i].y + bullets[i].height > a.y) {
            a.alive = false;
            hit = true;
            score += (4 - a.row) * 10;
            scoreEl.textContent = score;
            beep(200, 0.08, 'sawtooth');
            break;
          }
        }
        if (hit) {
          bullets.splice(i, 1);
        }
      }

      // Alien Movement
      alienMoveTimer++;
      if (alienMoveTimer >= alienMoveInterval) {
        alienMoveTimer = 0;
        let reachEdge = false;

        for (let a of aliens) {
          if (!a.alive) continue;
          if ((alienDirection === 1 && a.x + a.width + alienSpeedX >= canvas.width - 15) ||
              (alienDirection === -1 && a.x - alienSpeedX <= 15)) {
            reachEdge = true;
            break;
          }
        }

        if (reachEdge) {
          alienDirection = -alienDirection;
          for (let a of aliens) {
            a.y += 14;
            if (a.alive && a.y + a.height >= player.y) {
              gameOver();
              return;
            }
          }
        } else {
          for (let a of aliens) {
            a.x += alienDirection * alienSpeedX;
          }
        }

        // Alien random shooting
        const aliveAliens = aliens.filter(a => a.alive);
        if (aliveAliens.length === 0) {
          victory();
          return;
        }

        if (Math.random() < 0.65 && aliveAliens.length > 0) {
          const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
          alienBullets.push({
            x: shooter.x + shooter.width / 2,
            y: shooter.y + shooter.height,
            width: 3,
            height: 8,
            vy: 4
          });
        }
      }

      // Alien bullets update
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const ab = alienBullets[i];
        ab.y += ab.vy;

        // Hit player?
        if (
          ab.x + ab.width > player.x &&
          ab.x < player.x + player.width &&
          ab.y + ab.height > player.y &&
          ab.y < player.y + player.height
        ) {
          alienBullets.splice(i, 1);
          lives--;
          livesEl.textContent = '▲'.repeat(lives);
          beep(130, 0.25, 'sawtooth');
          if (lives <= 0) {
            gameOver();
            return;
          }
          continue;
        }

        if (ab.y > canvas.height) {
          alienBullets.splice(i, 1);
        }
      }
    }

    function gameOver() {
      isRunning = false;
      beep(110, 0.4, 'sawtooth');
      overlayTitle.textContent = 'MISSION FAILED';
      overlayDesc.textContent = `Earth invaded! Score: ${score}`;
      startBtn.textContent = 'TRY AGAIN';
      overlay.style.display = 'flex';
    }

    function victory() {
      isRunning = false;
      beep(680, 0.3);
      overlayTitle.textContent = 'WAVE CLEARED!';
      overlayDesc.textContent = `All invaders neutralized! Score: ${score}`;
      startBtn.textContent = 'NEXT WAVE';
      overlay.style.display = 'flex';
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for (let i = 0; i < 20; i++) {
        const sx = (i * 37) % canvas.width;
        const sy = (i * 59) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Player Cannon
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(player.x, player.y + 6, player.width, 10);
      ctx.fillRect(player.x + 8, player.y + 2, 16, 6);
      ctx.fillRect(player.x + 13, player.y - 4, 6, 6);

      // Player Bullets
      ctx.fillStyle = '#38bdf8';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      // Alien Bullets
      ctx.fillStyle = '#ef4444';
      alienBullets.forEach(ab => {
        ctx.fillRect(ab.x, ab.y, ab.width, ab.height);
      });

      // Aliens
      aliens.forEach(a => {
        if (!a.alive) return;
        const alienColors = ['#f43f5e', '#a855f7', '#06b6d4', '#eab308'];
        ctx.fillStyle = alienColors[a.row % alienColors.length];

        // Draw alien sprite pattern
        ctx.fillRect(a.x + 4, a.y, a.width - 8, 4);
        ctx.fillRect(a.x + 2, a.y + 4, a.width - 4, 8);
        ctx.fillRect(a.x, a.y + 12, 6, 6);
        ctx.fillRect(a.x + a.width - 6, a.y + 12, 6, 6);
        ctx.fillRect(a.x + 8, a.y + 10, a.width - 16, 4);

        // Eyes
        ctx.fillStyle = '#030712';
        ctx.fillRect(a.x + 5, a.y + 5, 3, 3);
        ctx.fillRect(a.x + a.width - 8, a.y + 5, 3, 3);
      });
    }

    function loop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', initGame);
    initAliens();
    draw();
  </script>
</body>
</html>
