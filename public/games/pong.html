<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 540px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .score-val { color: #38bdf8; font-size: 22px; font-family: monospace; }
    #canvas-container {
      position: relative;
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      border-radius: 10px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
    }
    .overlay h2 { font-size: 24px; margin-bottom: 8px; color: #f1f5f9; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 16px; }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #7dd3fc; transform: translateY(-1px); }
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .mode-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>PLAYER 1: <span id="p1-score" class="score-val">0</span></div>
    <div>RALLY: <span id="rally" class="score-val" style="color:#f59e0b">0</span></div>
    <div id="p2-label">CPU: <span id="p2-score" class="score-val">0</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="540" height="360"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">CLASSIC PONG</h2>
      <p id="overlay-desc">First to 7 points wins!</p>
      <div class="mode-toggle">
        <button id="mode-1p" class="mode-btn active">1 Player (vs CPU)</button>
        <button id="mode-2p" class="mode-btn">2 Players</button>
      </div>
      <button id="start-btn" class="btn">START MATCH</button>
    </div>
  </div>

  <div class="controls-hint">P1: W/S or Up/Down • P2 (if 2P): Up/Down Arrow Keys • Mouse: Move over canvas</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const p2Label = document.getElementById('p2-label');
    const rallyEl = document.getElementById('rally');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');
    const mode1pBtn = document.getElementById('mode-1p');
    const mode2pBtn = document.getElementById('mode-2p');

    let isTwoPlayer = false;
    let isRunning = false;
    let p1Score = 0;
    let p2Score = 0;
    let rally = 0;

    const PADDLE_WIDTH = 12;
    const PADDLE_HEIGHT = 70;
    const BALL_SIZE = 10;
    const WIN_SCORE = 7;

    const p1 = { x: 20, y: (canvas.height - PADDLE_HEIGHT) / 2, vy: 0, speed: 6 };
    const p2 = { x: canvas.width - 20 - PADDLE_WIDTH, y: (canvas.height - PADDLE_HEIGHT) / 2, vy: 0, speed: 5 };
    const ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5, vy: 3, speed: 5 };

    const keys = {};

    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, duration, type='sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    mode1pBtn.addEventListener('click', () => {
      isTwoPlayer = false;
      mode1pBtn.classList.add('active');
      mode2pBtn.classList.remove('active');
      p2Label.innerHTML = 'CPU: <span id="p2-score" class="score-val">' + p2Score + '</span>';
    });

    mode2pBtn.addEventListener('click', () => {
      isTwoPlayer = true;
      mode2pBtn.classList.add('active');
      mode1pBtn.classList.remove('active');
      p2Label.innerHTML = 'PLAYER 2: <span id="p2-score" class="score-val">' + p2Score + '</span>';
    });

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 5;
      const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8);
      ball.vx = direction * ball.speed * Math.cos(angle);
      ball.vy = ball.speed * Math.sin(angle);
      rally = 0;
      rallyEl.textContent = rally;
    }

    function startGame() {
      p1Score = 0;
      p2Score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      rally = 0;
      rallyEl.textContent = '0';
      p1.y = (canvas.height - PADDLE_HEIGHT) / 2;
      p2.y = (canvas.height - PADDLE_HEIGHT) / 2;
      resetBall(Math.random() > 0.5 ? 1 : -1);
      isRunning = true;
      overlay.style.display = 'none';
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      p1.y = mouseY - PADDLE_HEIGHT / 2;
      if (p1.y < 0) p1.y = 0;
      if (p1.y > canvas.height - PADDLE_HEIGHT) p1.y = canvas.height - PADDLE_HEIGHT;
    });

    function update() {
      if (!isRunning) return;

      // P1 controls (Keyboard)
      if (keys['KeyW'] || (!isTwoPlayer && keys['ArrowUp'])) {
        p1.y -= p1.speed;
      }
      if (keys['KeyS'] || (!isTwoPlayer && keys['ArrowDown'])) {
        p1.y += p1.speed;
      }
      if (p1.y < 0) p1.y = 0;
      if (p1.y > canvas.height - PADDLE_HEIGHT) p1.y = canvas.height - PADDLE_HEIGHT;

      // P2 controls
      if (isTwoPlayer) {
        if (keys['ArrowUp']) p2.y -= p2.speed;
        if (keys['ArrowDown']) p2.y += p2.speed;
      } else {
        // AI logic with human imperfection
        const targetY = ball.y - PADDLE_HEIGHT / 2;
        const diff = targetY - p2.y;
        if (Math.abs(diff) > 10) {
          p2.y += Math.sign(diff) * Math.min(Math.abs(diff), p2.speed);
        }
      }
      if (p2.y < 0) p2.y = 0;
      if (p2.y > canvas.height - PADDLE_HEIGHT) p2.y = canvas.height - PADDLE_HEIGHT;

      // Move Ball
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce top/bottom
      if (ball.y - BALL_SIZE / 2 <= 0) {
        ball.y = BALL_SIZE / 2;
        ball.vy = -ball.vy;
        beep(300, 0.05);
      } else if (ball.y + BALL_SIZE / 2 >= canvas.height) {
        ball.y = canvas.height - BALL_SIZE / 2;
        ball.vy = -ball.vy;
        beep(300, 0.05);
      }

      // Check P1 paddle collision
      if (
        ball.x - BALL_SIZE / 2 <= p1.x + PADDLE_WIDTH &&
        ball.x + BALL_SIZE / 2 >= p1.x &&
        ball.y >= p1.y &&
        ball.y <= p1.y + PADDLE_HEIGHT &&
        ball.vx < 0
      ) {
        const offset = (ball.y - (p1.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = Math.abs(ball.speed * Math.cos(offset * (Math.PI / 3)));
        ball.vy = ball.speed * Math.sin(offset * (Math.PI / 3));
        rally++;
        rallyEl.textContent = rally;
        beep(440, 0.08);
      }

      // Check P2 paddle collision
      if (
        ball.x + BALL_SIZE / 2 >= p2.x &&
        ball.x - BALL_SIZE / 2 <= p2.x + PADDLE_WIDTH &&
        ball.y >= p2.y &&
        ball.y <= p2.y + PADDLE_HEIGHT &&
        ball.vx > 0
      ) {
        const offset = (ball.y - (p2.y + PADDLE_HEIGHT / 2)) / (PADDLE_HEIGHT / 2);
        ball.speed = Math.min(ball.speed + 0.3, 14);
        ball.vx = -Math.abs(ball.speed * Math.cos(offset * (Math.PI / 3)));
        ball.vy = ball.speed * Math.sin(offset * (Math.PI / 3));
        rally++;
        rallyEl.textContent = rally;
        beep(520, 0.08);
      }

      // Point scoring
      if (ball.x < 0) {
        // P2 scores
        p2Score++;
        p2ScoreEl.textContent = p2Score;
        beep(220, 0.2, 'square');
        if (p2Score >= WIN_SCORE) {
          gameOver(isTwoPlayer ? 'PLAYER 2 WINS!' : 'CPU WINS!');
          return;
        }
        resetBall(1);
      } else if (ball.x > canvas.width) {
        // P1 scores
        p1Score++;
        p1ScoreEl.textContent = p1Score;
        beep(659, 0.2, 'square');
        if (p1Score >= WIN_SCORE) {
          gameOver('PLAYER 1 WINS!');
          return;
        }
        resetBall(-1);
      }
    }

    function gameOver(winnerText) {
      isRunning = false;
      overlayTitle.textContent = winnerText;
      overlayDesc.textContent = `Score: ${p1Score} - ${p2Score}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p1.x, p1.y, PADDLE_WIDTH, PADDLE_HEIGHT);

      ctx.fillStyle = isTwoPlayer ? '#a855f7' : '#ef4444';
      ctx.fillRect(p2.x, p2.y, PADDLE_WIDTH, PADDLE_HEIGHT);

      // Draw Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      if (isRunning) requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', startGame);
    draw();
  </script>
</body>
</html>
